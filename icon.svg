<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="orbitGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>

  <!-- Orbits -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Orbit 1: horizontal ellipse tilted 30 deg -->
    <ellipse cx="0" cy="0" rx="180" ry="65" transform="rotate(-30)" fill="none" stroke="url(#orbitGrad1)" stroke-width="8" stroke-dasharray="12 4"/>
    <!-- Orbit 2: tilted 90 deg -->
    <ellipse cx="0" cy="0" rx="180" ry="65" transform="rotate(30)" fill="none" stroke="url(#orbitGrad2)" stroke-width="8" stroke-dasharray="12 4"/>
    <!-- Orbit 3: vertical ellipse -->
    <ellipse cx="0" cy="0" rx="180" ry="65" transform="rotate(90)" fill="none" stroke="url(#orbitGrad3)" stroke-width="8"/>

    <!-- Electrons -->
    <circle cx="150" cy="-60" r="14" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="-150" cy="-60" r="14" fill="#34d399" filter="url(#glow)"/>
    <circle cx="0" cy="175" r="14" fill="#f43f5e" filter="url(#glow)"/>

    <!-- Central Nucleus -->
    <circle cx="0" cy="0" r="38" fill="#6366f1" filter="url(#glow)"/>
    <circle cx="-10" cy="-10" r="20" fill="#38bdf8"/>
    <circle cx="12" cy="8" r="18" fill="#ec4899"/>
    <circle cx="2" cy="-14" r="16" fill="#fbbf24"/>
    <circle cx="-4" cy="14" r="17" fill="#34d399"/>
  </g>
</svg>