<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070a14" />
  <title>Vật Lí 10 - Trọng lực và lực căng | Thầy Trần Mạnh Tùng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    
    :root {
      --primary: #4f46e5;
      --secondary: #06b6d4;
      --bg: #070a14;
      --surface: rgba(18, 25, 44, 0.94);
      --surface-border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --text-sub: #cbd5e1;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.22);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.22);
      --color-0: #f43f5e;
      --color-1: #8b5cf6;
      --color-2: #eab308;
      --color-3: #14b8a6;
      --font-scale: 1.0;
    }

    sub, sup { font-size: 0.74em; line-height: 0; position: relative; vertical-align: baseline; color: inherit; }
    sup { top: -0.42em; }
    sub { bottom: -0.22em; }
    sub, .math-sym sub, .formula-box sub { font-style: normal !important; font-family: var(--font-family) !important; font-weight: 600; white-space: nowrap; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

    /* FONT SCALE CONTROLS */
    .font-scale-group {
      display: inline-flex;
      align-items: center;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      gap: 1px;
    }
    .btn-font-scale {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 3px 8px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-font-scale:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .font-scale-badge {
      font-size: 0.74rem;
      font-weight: 700;
      color: #38bdf8;
      padding: 0 4px;
      min-width: 36px;
      text-align: center;
      user-select: none;
    }

    /* BASE LAYOUT: FULLSCREEN WITHOUT SCROLLING ON DESKTOP, IPAD, LANDSCAPE MOBILE */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(79, 70, 229, 0.28), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.22), transparent 45%);
      background-attachment: fixed;
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 1240px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 6px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 6px) env(safe-area-inset-left, 12px);
      overflow: hidden;
    }

    /* SLIM HEADER RIBBON */
    header {
      background: var(--surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 6px 12px;
      margin-bottom: 6px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(6, 182, 212, 0.45) rgba(255, 255, 255, 0.04);
      padding-bottom: 3px;
      -webkit-overflow-scrolling: touch;
    }
    .header-bar.is-dragging {
      cursor: grabbing !important;
      cursor: -webkit-grabbing !important;
    }
    .header-bar::-webkit-scrollbar {
      height: 4px;
    }
    .header-bar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
    }
    .header-bar::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.45);
      border-radius: 4px;
    }
    .header-bar::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.75);
    }

    .header-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    .teacher-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.35), rgba(6, 182, 212, 0.35));
      border: 1px solid rgba(129, 140, 248, 0.5);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #38bdf8;
      cursor: pointer;
      transition: 0.15s;
      user-select: none;
    }
    .teacher-badge:hover {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.5), rgba(6, 182, 212, 0.5));
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    .btn-edit-pen {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 2px;
    }

    .lesson-select {
      background: #1e293b;
      color: #fff;
      border: 1.5px solid #06b6d4;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      max-width: clamp(250px, 28vw, 360px);
    }
    .lesson-select option { background: #0f172a; color: #fff; }

    .lesson-title-badge {
      font-size: 0.92rem;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn-hub {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
      text-decoration: none;
      transition: 0.15s;
    }
    .nav-btn-hub:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* Mode tabs & Timer */
    .mode-tabs { display: flex; gap: 4px; }
    .btn-mode {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.6);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-mode.active {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      border-color: transparent;
    }

    .exam-timer-wrap { display: none; align-items: center; gap: 6px; }
    .exam-timer-wrap.active { display: inline-flex; }
    .timer-display {
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.9);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .timer-display.danger { color: #f43f5e; border-color: #f43f5e; animation: pulseRed 1s infinite; }
    @keyframes pulseRed { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .timer-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Mini-map */
    .mini-map-wrap {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .map-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.7);
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.76rem;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .map-btn.current { border-color: #38bdf8; color: #38bdf8; outline: 2px solid rgba(56, 189, 248, 0.5); }
    .map-btn.answered { background: rgba(99, 102, 241, 0.35); border-color: #818cf8; color: #fff; }
    .map-btn.res-correct { background: var(--success); color: #fff; border-color: var(--success); }
    .map-btn.res-wrong { background: var(--error); color: #fff; border-color: var(--error); }

    /* Right actions */
    .btn-quick-nav {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .btn-quick-nav:hover { background: rgba(6, 182, 212, 0.25); color: #fff; border-color: #06b6d4; }
    .btn-quick-nav.dash-btn {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.3), rgba(6, 182, 212, 0.3));
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    /* Progress line */
    .progress-bar-wrap {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      margin-top: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4);
      transition: width 0.25s ease;
    }

    /* MAIN QUIZ VIEWPORT - CENTERED & COMPACT WITHOUT WASTED SPACE */
    #quizContainer {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 8px 4px;
    }

    .quiz-card {
      background: var(--surface);
      backdrop-filter: blur(20px);
      border: 1.5px solid var(--surface-border);
      border-radius: 20px;
      padding: 22px 28px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      width: 100%;
      margin: auto;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 84px);
      overflow-y: auto;
      animation: cardAppear 0.2s ease-out;
    }
    @keyframes cardAppear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Unified Layout: for questions without graph */
    .quiz-card-unified {
      max-width: 960px;
    }

    /* Split Layout: for questions with SVG graph */
    /* Split Layout: for questions with SVG graph */
    .quiz-card-split {
      max-width: 1240px;
      width: 100%;
    }

    .quiz-split-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: stretch;
      width: 100%;
      height: 100%;
    }

    .quiz-pane-left {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }

    .quiz-pane-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
      gap: 12px;
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #38bdf8;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .q-meta-badge {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 3px 12px;
      border-radius: 999px;
      color: #38bdf8;
    }
    .q-meta-score {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 3px 12px;
      border-radius: 999px;
      color: #34d399;
      font-weight: 800;
    }
    .q-title {
      font-size: calc(clamp(1.02rem, 1.35vw, 1.25rem) * var(--font-scale));
      font-weight: 700;
      line-height: 1.55;
      margin-bottom: 18px;
      color: #f8fafc;
      flex-shrink: 0;
    }

    /* CSS Formula Engine */
    .math-sym { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; color: inherit; font-weight: 600; }
    .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; padding: 0 3px; font-size: 0.92em; line-height: 1.1; margin: 0 2px; color: inherit; }
    .numerator { border-bottom: 1.6px solid currentColor; padding-bottom: 1px; color: inherit; display: block; font-weight: 700; }
    .denominator { padding-top: 1px; color: inherit; display: block; font-weight: 700; }
    .formula-box {
      background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 10px; padding: 6px 14px; margin: 6px 0; display: inline-flex;
      align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 700; color: #38bdf8;
    }
    .nuclide {
      display: inline-flex; align-items: center; vertical-align: middle;
      font-style: normal; font-weight: 700; margin: 0 3px;
    }
    .nuclide .scripts {
      display: inline-flex; flex-direction: column; font-size: 0.72em; line-height: 1.05;
      text-align: right; margin-right: 2px; font-weight: 800; color: currentColor;
    }
    .nuclide .sym { font-size: 1.05em; font-weight: 800; color: inherit; }

    /* Graph container */
    /* Graph container: dynamic expansion based on available empty space */
    .graph-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
      width: 100%;
      flex: 1;
      min-height: 250px;
    }
    .graph-box {
      background: rgba(10, 14, 34, 0.9);
      border: 1.5px solid rgba(6, 182, 212, 0.4);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5), inset 0 0 15px rgba(6, 182, 212, 0.08);
      width: 100%;
      height: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      overflow: hidden;
    }
    .graph-box svg {
      width: 100%;
      height: 100%;
      max-height: 52vh;
      object-fit: contain;
      display: block;
    }

    .mcq-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    @media (min-width: 1100px) {
      .mcq-grid { grid-template-columns: 1fr 1fr; }
    }
    .mcq-btn {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(255,255,255,0.12);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      text-align: left;
      font-size: calc(0.94rem * var(--font-scale));
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      line-height: 1.48;
      transition: all 0.15s ease;
    }
    .mcq-btn:hover:not(.disabled) { background: rgba(255, 255, 255, 0.08); border-color: var(--secondary); transform: translateY(-1px); }
    .mcq-btn.selected { background: rgba(79, 70, 229, 0.25); border-color: var(--primary); box-shadow: 0 0 12px rgba(79, 70, 229, 0.4); }
    .mcq-btn.correct { background: var(--success-bg) !important; border-color: var(--success) !important; color: #a7f3d0; }
    .mcq-btn.wrong { background: var(--error-bg) !important; border-color: var(--error) !important; color: #fecaca; }
    .opt-key {
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #38bdf8;
      font-size: calc(0.86rem * var(--font-scale));
      flex-shrink: 0;
    }

    /* True/False Layout */
    .tf-table { display: flex; flex-direction: column; gap: 8px; }
    .tf-row { 
      background: rgba(255,255,255,0.03); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 10px; 
      padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; transition: 0.15s; 
    }
    @media (min-width: 680px) {
      .tf-row { flex-direction: row; align-items: center; justify-content: space-between; }
      .tf-stmt-text { flex: 1; padding-right: 10px; }
    }
    .tf-stmt-text { font-size: calc(0.88rem * var(--font-scale)); line-height: 1.45; }
    .tf-btns { display: flex; gap: 6px; flex-shrink: 0; }
    .tf-btn { 
      padding: 5px 12px; border-radius: 6px; font-size: calc(0.85rem * var(--font-scale)); font-weight: 700; cursor: pointer; 
      border: 1.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #cbd5e1; transition: 0.15s; 
    }
    .tf-btn:hover:not(.disabled) { background: rgba(255,255,255,0.12); color: #fff; }
    .tf-btn.selected-t { background: rgba(16, 185, 129, 0.25); border-color: var(--success); color: #6ee7b7; }
    .tf-btn.selected-f { background: rgba(239, 68, 68, 0.25); border-color: var(--error); color: #fca5a5; }
    .tf-btn.correct-eval { background: var(--success); border-color: var(--success); color: #fff; }
    .tf-btn.wrong-eval { background: var(--error); border-color: var(--error); color: #fff; }

    /* Match Pairs */
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .match-col { display: flex; flex-direction: column; gap: 8px; }
    .match-card {
      background: rgba(255,255,255,0.04); border: 1.5px solid rgba(255,255,255,0.12); border-radius: 10px;
      padding: 8px 12px; font-size: calc(0.90rem * var(--font-scale)); cursor: pointer; transition: 0.15s; line-height: 1.4;
    }
    .match-card:hover:not(.disabled) { background: rgba(255,255,255,0.08); border-color: var(--secondary); }
    .match-card.active-select { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

    /* Drag & Drop Word Bank */
    .fill-sentence { font-size: 0.92rem; line-height: 2.1; margin-bottom: 12px; background: rgba(0,0,0,0.3); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }
    .blank-slot { display: inline-flex; align-items: center; justify-content: center; min-width: 84px; height: 32px; padding: 0 12px; margin: 2px 4px; border: 1.5px dashed #06b6d4; background: rgba(6,182,212,0.14); text-align: center; font-weight: 800; color: #a5f3fc; font-size: calc(0.92rem * var(--font-scale)); cursor: pointer; vertical-align: middle; border-radius: 8px; transition: all 0.2s ease; user-select: none; }
    .blank-slot:hover:not(.locked) { background: rgba(6,182,212,0.25); border-color: #38bdf8; transform: translateY(-1px); }
    .blank-slot.active { background: rgba(14,165,233,0.28); border: 1.5px solid #38bdf8; color: #ffffff; box-shadow: 0 0 10px rgba(56,189,248,0.35); }
    .blank-slot.correct-slot { background: rgba(16,185,129,0.25) !important; border: 1.5px solid #10b981 !important; color: #a7f3d0 !important; box-shadow: 0 0 10px rgba(16,185,129,0.4) !important; }
    .blank-slot.wrong-slot { background: rgba(239,68,68,0.25) !important; border: 1.5px solid #ef4444 !important; color: #fecaca !important; box-shadow: 0 0 10px rgba(239,68,68,0.4) !important; }
    .blank-slot.locked { pointer-events: none; cursor: default; }
    .word-bank { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: rgba(0,0,0,0.35); border-radius: 12px; }
    .word-chip { background: #4f46e5; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: calc(0.86rem * var(--font-scale)); cursor: pointer; border: none; color: #fff; transition: 0.15s; }
    .word-chip.active-chip { outline: 2.5px solid #fff; transform: scale(1.05); }
    .word-chip.used { opacity: 0.25; pointer-events: none; }

    /* Actions */
    .quiz-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 18px;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      width: 100%;
    }
    .btn-action {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border: 1px solid transparent;
      color: #fff;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = idx === 3 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(f, now + 1.25);
            gain.gain.setValueAtTime(0.24, now + 1.25);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.75);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + 1.25);
            osc.stop(now + 2.80);
          });
        } catch(e) {}
      }
    };

    // Horizontal Wheel & Drag Scroll for Header Bar
    function initHeaderScroll() {
      const headerBars = document.querySelectorAll('.header-bar');
      headerBars.forEach(bar => {
        // Map vertical mouse wheel to horizontal scroll
        bar.addEventListener('wheel', (e) => {
          if (bar.scrollWidth > bar.clientWidth) {
            if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
              e.preventDefault();
              bar.scrollLeft += e.deltaY;
            }
          }
        }, { passive: false });

        // Mouse Drag to Scroll
        let isDown = false;
        let startX = 0;
        let scrollLeft = 0;

        bar.addEventListener('mousedown', (e) => {
          if (e.target.closest('button, select, a, input, .teacher-badge')) return;
          isDown = true;
          bar.classList.add('is-dragging');
          startX = e.pageX - bar.offsetLeft;
          scrollLeft = bar.scrollLeft;
        });

        window.addEventListener('mouseup', () => {
          if (isDown) {
            isDown = false;
            bar.classList.remove('is-dragging');
          }
        });

        bar.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - bar.offsetLeft;
          const walk = (x - startX) * 1.5;
          bar.scrollLeft = scrollLeft - walk;
        });
      });
    }

    // Canvas Confetti
    function fireConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];
      for (let i = 0; i < 80; i++) {
        pieces.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.7) * 16,
          size: Math.random() * 7 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.rotation += p.rotSpeed;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        frame++;
        if (frame < 100) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    // Fisher-Yates Shuffling
    function cloneAndShuffleQuestions(source) {
      const cloned = JSON.parse(JSON.stringify(source));
      cloned.forEach(q => {
        if (q.type === 'mcq') {
          let ansIdx = q.ans;
          if (typeof ansIdx === 'string') {
            const letter = ansIdx.trim().toUpperCase();
            if (letter === 'A') ansIdx = 0;
            else if (letter === 'B') ansIdx = 1;
            else if (letter === 'C') ansIdx = 2;
            else if (letter === 'D') ansIdx = 3;
            else ansIdx = parseInt(ansIdx, 10);
          }
          if (isNaN(ansIdx) || ansIdx < 0 || ansIdx >= q.opts.length) ansIdx = 0;
          const originalCorrectOpt = q.opts[ansIdx];
          const items = q.opts.map((opt, i) => ({ text: opt, isCorrect: i === ansIdx }));
          for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
          }
          q.opts = items.map(it => it.text);
          q.ans = items.findIndex(it => it.isCorrect);
          q.correctText = 'Phương án ' + String.fromCharCode(65 + q.ans) + ': ' + originalCorrectOpt;
        }
      });
      return cloned;
    }

          if (quizMode === 'exam') saveExamAnswer(currentQ, {...matchPairs});

      matchB = idx;
      refreshMatchUI();

    /* Drag */
    function renderDrag(q, idx) {
      let sentenceHtml = q.sentence || q.text || '';
      // Step 1: Pre-tokenize placeholders into unique tokens to eliminate substring nesting collisions
      for (let i = 0; i < q.ans.length; i++) {
        const p1 = '___' + i + '___';
        const p2 = '[' + i + ']';
        const p3 = '[blank]';
        const tok = '%%%SLOT_' + i + '%%%';
        if (sentenceHtml.includes(p1)) {
          sentenceHtml = sentenceHtml.replace(p1, tok);
        } else if (sentenceHtml.includes(p2)) {
          sentenceHtml = sentenceHtml.replace(p2, tok);
        } else if (sentenceHtml.includes(p3)) {
          sentenceHtml = sentenceHtml.replace(p3, tok);
        }
      }

      // Step 2: Replace tokens with slot HTML using (1), (2), (3) notation
      for (let i = 0; i < q.ans.length; i++) {
        const val = dragFilled[i] ? dragFilled[i] : '(' + (i + 1) + ')';
        const activeCls = dragFilled[i] ? ' active' : '';
        const slotHtml = '<span class="blank-slot' + activeCls + '" id="slot' + i + '" onclick="clickDragBlank(' + i + ')">' + val + '</span>';
        sentenceHtml = sentenceHtml.replace('%%%SLOT_' + i + '%%%', slotHtml);
      }

      let html = '<div class="fill-sentence">' + sentenceHtml + '</div>' +
        '<div style="font-size:0.84rem; color:#94a3b8; font-weight:600; margin-bottom:6px;">💡 Chạm một từ khóa bên dưới, sau đó chạm vào vị trí khuyết để điền:</div>' +
        '<div class="word-bank">';

        const isUsed = dragFilled.includes(w);
        html += '<button class="word-chip ' + (isUsed ? 'used' : '') + '" id="wordChip' + i + '" onclick="clickDragWord(\'' + w.replace(/'/g, "\\'") + '\', ' + i + ')">' + w + '</button>';

    /* Save user answers in Exam Mode */
    function saveExamAnswer(qIdx, val) {
      const q = questions[qIdx];
      let score = 0;
      let isFullyCorrect = false;

      if (q.type === 'mcq') {
        isFullyCorrect = (val === q.ans);
        score = isFullyCorrect ? 1.0 : 0.0;
      } else if (q.type === 'tf') {
        let correctCount = 0;
        q.stmts.forEach((st, sIdx) => {
          const expected = (q.ans && Array.isArray(q.ans)) ? q.ans[sIdx] : (st.a !== undefined ? st.a : null);
          if (val[sIdx] === expected) correctCount++;
        });
        if (correctCount === 1) score = 0.1;
        else if (correctCount === 2) score = 0.25;
        else if (correctCount === 3) score = 0.5;
        else if (correctCount === 4) score = 1.0;
        isFullyCorrect = (correctCount === 4);
      } else if (q.type === 'match') {
        let correctPairs = 0;
        for (const [k, v] of Object.entries(val)) {
          const kIdx = parseInt(k);
          if (q.ans && q.ans[kIdx] !== undefined) {
            if (q.ans[kIdx] === v || (q.colB && q.colB[v] === q.ans[kIdx])) correctPairs++;
          }
        }
        score = (correctPairs / q.colA.length) * 1.0;
        isFullyCorrect = (correctPairs === q.colA.length);
      } else if (q.type === 'drag') {
        let correctSlots = 0;
        q.ans.forEach((ansTarget, aIdx) => {
          const expectedWord = (typeof ansTarget === 'number' && q.words) ? q.words[ansTarget] : ansTarget;
          if (val[aIdx] === expectedWord) correctSlots++;
        });
        score = (correctSlots / q.ans.length) * 1.0;
        isFullyCorrect = (correctSlots === q.ans.length);
      }

      examUserAnswers[qIdx] = { val, score, isFullyCorrect, rawQ: q };
      renderMiniMap();
    }

    function checkAnswer(idx) {
      const q = questions[idx];
      let earned = 0;
      let isFullyCorrect = false;

      if (q.type === 'mcq') {
        if (mcqSelected === null) {
          alert('Em vui lòng chọn một phương án trước khi kiểm tra!');
          return;
        }
        document.querySelectorAll('.mcq-btn').forEach(b => b.classList.add('disabled'));
        isFullyCorrect = (mcqSelected === q.ans);
        earned = isFullyCorrect ? 1.0 : 0.0;
        document.getElementById('mcqOpt' + q.ans).classList.add('correct');
        if (!isFullyCorrect) {
          document.getElementById('mcqOpt' + mcqSelected).classList.add('wrong');
        }
      } else if (q.type === 'tf') {
        if (tfState.some(v => v === null)) {
          alert('Em hãy chọn Đúng hoặc Sai cho tất cả 4 nhận định!');
          return;
        }
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.add('disabled'));
        let correctCount = 0;
        q.stmts.forEach((st, sIdx) => {
          const userVal = tfState[sIdx];
          const expected = (q.ans && Array.isArray(q.ans)) ? q.ans[sIdx] : (st.a !== undefined ? st.a : null);
          const isItemCorrect = (userVal === expected);
          if (isItemCorrect) correctCount++;
          const targetBtn = userVal ? document.getElementById('btnT' + sIdx) : document.getElementById('btnF' + sIdx);
          if (targetBtn) targetBtn.classList.add(isItemCorrect ? 'correct-eval' : 'wrong-eval');
        });

        if (correctCount === 1) earned = 0.1;
        else if (correctCount === 2) earned = 0.25;
        else if (correctCount === 3) earned = 0.5;
        else if (correctCount === 4) earned = 1.0;
        isFullyCorrect = (correctCount === 4);
      } else if (q.type === 'match') {
        if (Object.keys(matchPairs).length < q.colA.length) {
          alert('Em hãy ghép đầy đủ các cặp ở Cột A với Cột B!');
          return;
        }
        let correctPairs = 0;
        for (const [k, v] of Object.entries(matchPairs)) {
          const kIdx = parseInt(k);
          if (q.ans && q.ans[kIdx] !== undefined) {
            if (q.ans[kIdx] === v || (q.colB && q.colB[v] === q.ans[kIdx])) correctPairs++;
          }
        }
        earned = (correctPairs / q.colA.length) * 1.0;
        isFullyCorrect = (correctPairs === q.colA.length);
      } else if (q.type === 'drag') {
        if (dragFilled.some(v => !v)) {
          alert('Em hãy điền đầy đủ các vị trí còn khuyết!');
          return;
        }
        let correctSlots = 0;
        q.ans.forEach((ansTarget, aIdx) => {
          const expectedWord = (typeof ansTarget === 'number' && q.words) ? q.words[ansTarget] : ansTarget;
          if (dragFilled[aIdx] === expectedWord) correctSlots++;
        });
        earned = (correctSlots / q.ans.length) * 1.0;
        isFullyCorrect = (correctSlots === q.ans.length);
      }

      totalPoints += earned;
      examUserAnswers[idx] = { val: (q.type === 'mcq' ? mcqSelected : (q.type === 'tf' ? [...tfState] : (q.type === 'match' ? {...matchPairs} : [...dragFilled]))), score: earned, isFullyCorrect, rawQ: q };

      if (isFullyCorrect) AudioEngine.playCorrect();
      else AudioEngine.playWrong();

      renderMiniMap();

      let badgeClass = isFullyCorrect ? '' : (earned > 0 ? 'partial' : 'wrong');
      let statusIcon = isFullyCorrect ? '🎉 Chính xác (+1.0 điểm)' : (earned > 0 ? '⚠️ Đúng một phần (+' + earned.toFixed(2) + ' điểm)' : '❌ Chưa chính xác (+0.0 điểm)');

      const expHtml = renderExplanationHTML(q, badgeClass, statusIcon);

      document.getElementById('explanationPlaceholder').innerHTML = expHtml;
      applyExpFontSize();
      const nextText = (idx < questions.length - 1) ? 'Tiếp tục sang câu sau ➔' : 'Xem tổng kết kết quả 🏆';
      const nextAction = (idx < questions.length - 1) ? 'nextQuestion()' : 'showResults()';
      document.getElementById('actionWrap').innerHTML = '<button class="btn-action btn-next-step" onclick="' + nextAction + '">' + nextText + '</button>';
    }

    function restorePracticeExplanation(idx, record) {
      const q = questions[idx];
      let badgeClass = record.isFullyCorrect ? '' : (record.score > 0 ? 'partial' : 'wrong');
      let statusIcon = record.isFullyCorrect ? '🎉 Chính xác (+1.0 điểm)' : (record.score > 0 ? '⚠️ Đúng một phần (+' + record.score.toFixed(2) + ' điểm)' : '❌ Chưa chính xác (+0.0 điểm)');

      const expHtml = renderExplanationHTML(q, badgeClass, statusIcon);

      document.getElementById('explanationPlaceholder').innerHTML = expHtml;
      applyExpFontSize();
      const nextText = (idx < questions.length - 1) ? 'Tiếp tục sang câu sau ➔' : 'Xem tổng kết kết quả 🏆';
      const nextAction = (idx < questions.length - 1) ? 'nextQuestion()' : 'showResults()';
      document.getElementById('actionWrap').innerHTML = '<button class="btn-action btn-next-step" onclick="' + nextAction + '">' + nextText + '</button>';
    }

    function prevQuestion() {
      AudioEngine.playClick();
      if (currentQ > 0) {
        currentQ--;
        renderQuestion(currentQ);
      }
    }

    function nextQuestion() {
      AudioEngine.playClick();
      currentQ++;
      if (currentQ < questions.length) {
        renderQuestion(currentQ);
      } else {
        if (quizMode === 'practice') {
          showResults();
        } else {
          confirmSubmitExam();
        }
      }
    }

    // Explanation Zoom Engine
    const EXP_FONT_SCALES = [0.85, 1.00, 1.15, 1.30, 1.50];
    let expScaleIdx = 1;

    function initExpZoom() {
      try {
        const saved = SafeStorage.getItem('VT_EXP_FONT_SCALE');
        if (saved !== null && !isNaN(parseInt(saved, 10))) {
          expScaleIdx = Math.max(0, Math.min(EXP_FONT_SCALES.length - 1, parseInt(saved, 10)));
        }
      } catch(e) {}
      applyExpFontSize();
    }

    function changeExpFontSize(delta) {
      AudioEngine.playClick();
      expScaleIdx = Math.max(0, Math.min(EXP_FONT_SCALES.length - 1, expScaleIdx + delta));
      try {
        SafeStorage.setItem('VT_EXP_FONT_SCALE', expScaleIdx);
      } catch(e) {}
      applyExpFontSize();
    }

    function applyExpFontSize() {
      const scale = EXP_FONT_SCALES[expScaleIdx];
      document.documentElement.style.setProperty('--exp-font-scale', scale);
      const display = document.getElementById('expZoomLevelDisplay');
      if (display) display.textContent = Math.round(scale * 100) + '%';
    }

    function toggleExpZoom(e) {
      if (e) e.stopPropagation();
      AudioEngine.playClick();
      const panel = document.getElementById('expPanel');
      if (!panel) return;
      const isZoomed = panel.classList.toggle('is-zoomed');
      const icon = document.getElementById('expExpandIcon');
      const label = document.getElementById('expExpandLabel');
      if (isZoomed) {
        if (icon) icon.textContent = '🗗';
        if (label) label.textContent = 'Thu nhỏ';
      } else {
        if (icon) icon.textContent = '⛶';
        if (label) label.textContent = 'Phóng to';
      }
    }

    document.addEventListener('click', (e) => {
      const panel = document.getElementById('expPanel');
      if (panel && panel.classList.contains('is-zoomed')) {
        if (!panel.contains(e.target)) {
          toggleExpZoom();
        }
      }
    });

    function initKeyboardNavigation() {
      window.addEventListener('keydown', (e) => {
        // Ignore navigation when typing in form inputs or dropdowns
        const activeEl = document.activeElement;
        const tag = activeEl ? activeEl.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        if (e.key === 'Escape') {
          const panel = document.getElementById('expPanel');
          if (panel && panel.classList.contains('is-zoomed')) {
            e.preventDefault();
            toggleExpZoom();
            return;
          }
        }

        // Ignore if modal is open
        const teacherModal = document.getElementById('teacherModal');
        if (teacherModal && teacherModal.style.display === 'flex') return;

        // Ignore if result card or dashboard/exam review is open
        const resCard = document.getElementById('resultCard');
        if (resCard && resCard.style.display === 'block') return;
        const revContainer = document.getElementById('examReviewContainer');
        if (revContainer && revContainer.style.display === 'block') return;

        // ArrowUp or ArrowLeft: Previous question
        if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
          e.preventDefault();
          if (currentQ > 0) {
            prevQuestion();
          }
        }
        // ArrowDown or ArrowRight: Next question
        else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
          e.preventDefault();
          if (currentQ < questions.length - 1) {
            nextQuestion();
          } else if (quizMode === 'practice') {
            const expPh = document.getElementById('explanationPlaceholder');
            if (expPh && expPh.innerHTML.trim() !== '') {
              showResults();
            }
          }
        }
      });
    }

    function confirmSubmitExam() {
      const answeredCount = Object.keys(examUserAnswers).length;
      if (answeredCount < questions.length) {
        if (!confirm('Em mới trả lời ' + answeredCount + '/' + questions.length + ' câu. Em có chắc chắn muốn nộp bài thi ngay không?')) {
          return;
        }
      } else {
        if (!confirm('Em đã hoàn thành trọn vẹn 10 câu. Em muốn nộp bài thi để xem kết quả ngay?')) {
          return;
        }
      }
      submitExam();
    }

    function submitExam() {
      clearInterval(examTimer);
      totalPoints = 0;
      for (let i = 0; i < questions.length; i++) {
        const item = examUserAnswers[i];
        if (item) totalPoints += item.score;
      }
      showResults();
    }
  

    let questions = [];
    let currentQ = 0;
    let totalPoints = 0;
    let quizMode = 'practice';
    let examDurationMinutes = 15;
    let examTimer = null;
    let examSecondsLeft = 15 * 60;
    let examUserAnswers = {};
    const container = document.getElementById('quizContainer');

    let mcqSelected = null;
    let tfState = [];
    let matchA = null; let matchB = null; let matchPairs = {};
    let dragActiveWord = null; let dragFilled = [];

    function setQuizMode(mode) {
      AudioEngine.playClick();
      quizMode = mode;
      document.getElementById('btnModePractice').classList.toggle('active', mode === 'practice');
      document.getElementById('btnModeExam').classList.toggle('active', mode === 'exam');
      document.getElementById('examTimerWrap').classList.toggle('active', mode === 'exam');
      if (mode === 'exam') startExamTimer();
      else clearInterval(examTimer);
      restartLesson();
    }

    function changeExamDuration(mins) {
      examDurationMinutes = parseInt(mins);
      if (quizMode === 'exam') {
        startExamTimer();
        restartLesson();
      }
    }

    function startExamTimer() {
      clearInterval(examTimer);
      examSecondsLeft = examDurationMinutes * 60;
      updateTimerUI();
      examTimer = setInterval(() => {
        examSecondsLeft--;
        updateTimerUI();
        if (examSecondsLeft <= 0) {
          clearInterval(examTimer);
          alert('⏰ Đã hết thời gian làm bài! Hệ thống đang tự động nộp bài thi của em.');
          submitExam();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const display = document.getElementById('timerDisplay');
      if (!display) return;
      const m = Math.floor(examSecondsLeft / 60);
      const s = examSecondsLeft % 60;
      display.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      display.classList.toggle('danger', examSecondsLeft < 60);
    }

    function renderMiniMap() {
      const mapWrap = document.getElementById('miniMapWrap');
      if (!mapWrap) return;
      let html = '';
      questions.forEach((q, idx) => {
        let cls = 'map-btn';
        if (idx === currentQ) cls += ' current';
        if (quizMode === 'exam') {
          if (examUserAnswers[idx] !== undefined) cls += ' answered';
        } else {
          const ansRecord = examUserAnswers[idx];
          if (ansRecord) {
            cls += ansRecord.score >= 0.99 ? ' res-correct' : ' res-wrong';
          }
        }
        html += '<button class="' + cls + '" onclick="jumpToQuestion(' + idx + ')">' + (idx + 1) + '</button>';
      });
      mapWrap.innerHTML = html;
    }

    function jumpToQuestion(idx) {
      AudioEngine.playClick();
      currentQ = idx;
      renderQuestion(currentQ);
    }

    function renderQuestion(idx) {
      document.getElementById('resultCard').style.display = 'none';
      renderMiniMap();

      const q = questions[idx];
      if (!q) return;

      let interactionHtml = '';
      if (q.type === 'mcq') interactionHtml = renderMCQ(q, idx);
      else if (q.type === 'tf') interactionHtml = renderTF(q, idx);
      else if (q.type === 'match') interactionHtml = renderMatch(q, idx);
      else if (q.type === 'drag') interactionHtml = renderDrag(q, idx);

      let actionButtonsHtml = '';
      if (quizMode === 'practice') {
        actionButtonsHtml = '<button class="btn-action" id="btnSubmit" onclick="checkAnswer(' + idx + ')">Kiểm tra kết quả 🎯</button>';
      } else {
        actionButtonsHtml = '<div style="display:flex; gap:6px;">' +
          (idx > 0 ? '<button class="btn-action btn-secondary" onclick="prevQuestion()">◀ Trước</button>' : '') +
          (idx < questions.length - 1 ? '<button class="btn-action btn-secondary" onclick="nextQuestion()">Sau ▶</button>' : '') +
        '</div>' +
        '<button class="btn-action btn-submit-exam" onclick="confirmSubmitExam()">Nộp bài thi 🏁</button>';
      }

      let svgHtml = '';
      if (q.svgGraph) {
        let svgCode = q.svgGraph;
        const svgMatch = svgCode.match(/<svg[\s\S]*<\/svg>/i);
        if (svgMatch) svgCode = svgMatch[0];
        svgHtml = '<div class="graph-container"><div class="graph-box">' + svgCode + '</div></div>';
      }

      const hasSvg = !!svgHtml;
      let html = '';
      if (hasSvg) {
        html = '<div class="quiz-card quiz-card-split" id="qCard">' +
          '<div class="quiz-split-grid">' +
            '<div class="quiz-pane-left">' +
              '<div class="q-meta">' +
                '<span class="q-meta-badge">Câu ' + (idx + 1) + '/' + questions.length + ' • ' + getTypeName(q.type) + '</span>' +
                '<span class="q-meta-score">1.0 Điểm</span>' +
              '</div>' +
              '<div class="q-title">' + q.q + '</div>' +
              svgHtml +
            '</div>' +
            '<div class="quiz-pane-right">' +
              '<div class="q-interaction-wrap">' + interactionHtml + '</div>' +
              '<div class="quiz-actions" id="actionWrap">' + actionButtonsHtml + '</div>' +
              '<div id="explanationPlaceholder"></div>' +
            '</div>' +
          '</div>' +
        '</div>';
      } else {
        html = '<div class="quiz-card quiz-card-unified" id="qCard">' +
          '<div class="q-meta">' +
            '<span class="q-meta-badge">Câu ' + (idx + 1) + '/' + questions.length + ' • ' + getTypeName(q.type) + '</span>' +
            '<span class="q-meta-score">1.0 Điểm</span>' +
          '</div>' +
          '<div class="q-title">' + q.q + '</div>' +
          '<div class="q-interaction-wrap">' + interactionHtml + '</div>' +
          '<div class="quiz-actions" id="actionWrap">' + actionButtonsHtml + '</div>' +
          '<div id="explanationPlaceholder"></div>' +
        '</div>';
      }

      container.innerHTML = html;
      initQuestionState(idx);
      updateProgress();
    }

    function initQuestionState(idx) {
      const saved = examUserAnswers[idx];
      if (saved) {
        if (questions[idx].type === 'mcq') mcqSelected = saved.val;
        else if (questions[idx].type === 'tf') tfState = [...saved.val];
        else if (questions[idx].type === 'match') matchPairs = {...saved.val};
        else if (questions[idx].type === 'drag') dragFilled = [...saved.val];
      } else {
        mcqSelected = null;
        tfState = questions[idx].type === 'tf' ? new Array(questions[idx].stmts.length).fill(null) : [];
        matchA = null; matchB = null; matchPairs = {};
        dragActiveWord = null;
        dragFilled = questions[idx].type === 'drag' ? new Array(questions[idx].ans.length).fill(null) : [];
      }

      if (saved && quizMode === 'practice') {
        restorePracticeExplanation(idx, saved);
      }
    }

    function updateProgress() {
      document.getElementById('progressBar').style.width = ((currentQ / questions.length) * 100) + '%';
    }

    function showResults() {
      container.innerHTML = '';
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('finalScore').textContent = totalPoints.toFixed(1);

      try {
        const key = 'VT10_LESSON_SCORE_' + LESSON_ID;
        const oldScore = parseFloat(SafeStorage.getItem(key) || '0');
        if (totalPoints > oldScore) {
          SafeStorage.setItem(key, totalPoints.toFixed(2));
        }
      } catch(e) {}

      if (quizMode === 'exam') {
        renderExamReview();
      }

      const title = document.getElementById('resultTitle');
      const cmt = document.getElementById('resultComment');

      AudioEngine.playWin();
      fireConfetti();

      if (totalPoints >= 9.0) {
        title.textContent = 'Xuất sắc tuyệt đối! 🌟';
        cmt.textContent = teacherName + ' biểu dương em! Em đã làm chủ hoàn hảo bài học Vật Lí 10 với tư duy sắc bén và năng lực vật lí vượt trội!';
      } else if (totalPoints >= 7.0) {
        title.textContent = 'Lực học rất tốt! 👏';
        cmt.textContent = 'Em nắm rất chắc lý thuyết và phương pháp tính toán. Hãy rà soát thêm câu Đúng/Sai và đồ thị để đạt điểm 10 tuyệt đối!';
      } else if (totalPoints >= 5.0) {
        title.textContent = 'Đạt yêu cầu căn bản! 🎯';
        cmt.textContent = 'Em đã hiểu các khái niệm cơ bản. Hãy xem lại kỹ lời giải chi tiết của ' + teacherName + ' để củng cố các câu còn nhầm lẫn nhé!';
      } else {
        title.textContent = 'Cần củng cố thêm lý thuyết! 📚';
        cmt.textContent = 'Em hãy làm lại bài thử thách một lần nữa để thành thạo kiến thức nhé!';
      }

      document.getElementById('resultCard').style.display = 'block';
    }

    function renderExamReview() {
      const revWrap = document.getElementById('examReviewContainer');
      revWrap.style.display = 'block';

      let html = '<h3 style="color:#38bdf8; font-size:1.05rem; margin-bottom:8px; font-weight:800;">📋 Bảng Rà Soát Chi Tiết 10 Câu Thi:</h3>' +
        '<div class="review-table-wrap">' +
          '<table class="review-table">' +
            '<thead>' +
              '<tr>' +
                '<th>Câu</th>' +
                '<th>Dạng bài</th>' +
                '<th>Kết quả</th>' +
                '<th>Điểm</th>' +
                '<th>Đáp án chuẩn</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody>';

      questions.forEach((q, i) => {
        const item = examUserAnswers[i];
        const score = item ? item.score : 0;
        const resText = item ? (item.isFullyCorrect ? '<span style="color:#10b981; font-weight:800;">Chính xác</span>' : (item.score > 0 ? '<span style="color:#f59e0b; font-weight:700;">Đúng 1 phần</span>' : '<span style="color:#ef4444; font-weight:700;">Sai</span>')) : '<span style="color:#64748b;">Bỏ trống</span>';

        html += '<tr>' +
          '<td><b>Câu ' + (i + 1) + '</b></td>' +
          '<td>' + getTypeName(q.type) + '</td>' +
          '<td>' + resText + '</td>' +
          '<td><b>+' + score.toFixed(2) + '</b></td>' +
          '<td><span style="color:#38bdf8; font-weight:700;">' + q.correctText + '</span></td>' +
        '</tr>';
      });

      html += '</tbody></table></div>';
      revWrap.innerHTML = html;
    }

    function restartLesson() {
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('examReviewContainer').style.display = 'none';
      currentQ = 0;
      totalPoints = 0;
      examUserAnswers = {};
      questions = cloneAndShuffleQuestions(RAW_QUESTIONS);
      if (quizMode === 'exam') startExamTimer();
      renderQuestion(0);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initFontScale();
      initTeacherName();
      initHeaderScroll();
      initKeyboardNavigation();
      initExpZoom();
      restartLesson();
    });
  </script>
</body>
</html>
